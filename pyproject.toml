[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-ec-data-platform"
version = "0.1.0"
description = "Synthetic-data ELT platform for fashion e-commerce (dbt, Airflow, Spark, GCP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
]

[project.scripts]
fashion-ec-generate = "fashion_ec.generate:main"
fashion-ec-load = "fashion_ec.load:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
]
dbt = [
    "dbt-core>=1.10,<1.13",
    "dbt-bigquery>=1.10,<1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that need external services (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
